[package]
name = "specguard"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "AGENTS.md conventions, native specification checks and artifact drift verification"

[dependencies]
guard-install = { path = "../guardengine/crates/guard-install" }
guard-evidence = { path = "../guardengine/crates/guard-evidence" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
